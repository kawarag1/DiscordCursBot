services:
  app:
    build:
      context: ../.
      dockerfile: docker/Dockerfile.bot
    command: uv run python bot.py
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app/src 
    networks:
      - my-shared-network 


  fastapi:
    container_name: ds_bot_api
    build:
      context: ../.
      dockerfile: docker/Dockerfile.fastapi
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ../.env
    ports:
      - 8000:8000
    depends_on:
      - discord_database
    networks:
      - my-shared-network
    
    

  discord_database:
    container_name: discord_database
    image: postgres:latest
    env_file:
      - ../.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5555:5432
    volumes:
      - /var/lib/postgresql
    networks:
      - my-shared-network

  redis:
    container_name: discord_redis
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - my-shared-network
    restart: unless-stopped

networks:
  my-shared-network:
    external: true

volumes:
  redis_data:     
  postgres_data: